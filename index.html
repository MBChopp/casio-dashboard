<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>CASIO</title>
  <style>
    @font-face {
      font-family: 'DSEG7';
      src: url('https://cdn.jsdelivr.net/npm/dseg@0.46.0/fonts/DSEG7-Classic/DSEG7Classic-Regular.woff2') format('woff2'),
           url('https://cdn.jsdelivr.net/npm/dseg@0.46.0/fonts/DSEG7-Classic/DSEG7Classic-Regular.woff') format('woff');
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <!-- Estilos de tema inyectados por JS -->
  <style id="theme-style"></style>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html, body { width:100%; height:100%; overflow:hidden; }

    body {
      display:-webkit-flex; display:flex;
      -webkit-align-items:center; align-items:center;
      -webkit-justify-content:center; justify-content:center;
      font-family: 'Share Tech Mono','Courier New',monospace;
    }

    .watch {
      width:92vw; height:88vh;
      border-width:2px; border-style:solid; border-radius:6px;
      position:relative;
      display:-webkit-flex; display:flex;
      -webkit-flex-direction:column; flex-direction:column;
      overflow:hidden;
    }

    .watch-inner {
      position:absolute; inset:5px;
      border-width:1px; border-style:solid; border-radius:4px;
      pointer-events:none; z-index:1;
    }

    /* HEADER */
    .header {
      display:-webkit-flex; display:flex;
      -webkit-flex-direction:row; flex-direction:row;
      -webkit-align-items:center; align-items:center;
      -webkit-justify-content:space-between; justify-content:space-between;
      padding:1.2vh 2.5vw 0.8vh;
      border-bottom-width:1px; border-bottom-style:solid;
      position:relative; z-index:2;
    }
    .h-label { font-size:1vw; letter-spacing:0.22em; text-transform:uppercase; }
    .modes { display:-webkit-flex; display:flex; gap:0.6vw; }
    .mode-btn {
      font-family:'Share Tech Mono','Courier New',monospace;
      font-size:1.05vw; letter-spacing:0.12em; cursor:pointer;
      background:none; border-width:1px; border-style:solid;
      padding:0.65vh 1.1vw; border-radius:2px;
      -webkit-user-select:none; user-select:none;
    }

    /* HORA */
    .time-block {
      display:-webkit-flex; display:flex;
      -webkit-flex-direction:column; flex-direction:column;
      -webkit-align-items:center; align-items:center;
      -webkit-justify-content:center; justify-content:center;
      -webkit-flex:1.3; flex:1.3;
      border-bottom-width:1px; border-bottom-style:solid;
      position:relative; z-index:2;
    }

    .lcd-wrap { position:relative; display:inline-block; line-height:1; }
    .lcd-ghost {
      font-family:'DSEG7','Courier New',monospace;
      font-size:25vw; letter-spacing:0.035em;
      position:absolute; top:0; left:0; pointer-events:none;
    }
    .lcd-real {
      font-family:'DSEG7','Courier New',monospace;
      font-size:25vw; letter-spacing:0.035em; position:relative;
    }
    .sep-blink {
      -webkit-animation:blink 1s step-end infinite;
      animation:blink 1s step-end infinite;
    }
    @-webkit-keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.06} }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.06} }

    .date-row { display:-webkit-flex; display:flex; gap:4vw; margin-top:5vh; }
    .date-chip { font-size:3vw; letter-spacing:0.22em; text-transform:uppercase; }

    /* PAINEL INFERIOR */
    .bottom {
      display:-webkit-flex; display:flex;
      -webkit-flex-direction:row; flex-direction:row;
      -webkit-flex:1; flex:1;
      position:relative; z-index:2; min-height:0;
    }
    .panel {
      display:-webkit-flex; display:flex;
      -webkit-flex-direction:column; flex-direction:column;
      padding:1.5vh 1.8vw; overflow:hidden; min-width:0;
    }
    .panel-left {
      width:43%; -webkit-flex:0 0 43%; flex:0 0 43%;
      border-right-width:1px; border-right-style:solid;
    }
    .panel-right {
      width:57%; -webkit-flex:1; flex:1;
    }
    .panel-label {
      font-size:1.05vw; letter-spacing:0.2em; text-transform:uppercase;
      margin-bottom:1vh;
      border-bottom-width:1px; border-bottom-style:solid;
      padding-bottom:0.5vh;
    }

    /* CLIMA ATUAL */
    .weather-row {
      display:-webkit-flex; display:flex;
      -webkit-flex-direction:row; flex-direction:row;
      -webkit-align-items:center; align-items:center;
      width:100%;
    }
    .weather-main {
      display:-webkit-flex; display:flex;
      -webkit-flex-direction:column; flex-direction:column;
      -webkit-align-items:flex-start; align-items:flex-start;
      -webkit-flex:0 0 48%; flex:0 0 48%;
    }
    .temp-wrap { position:relative; display:inline-block; line-height:1; }
    .temp-ghost {
      font-family:'DSEG7','Courier New',monospace;
      font-size:11vw; letter-spacing:0.025em;
      position:absolute; top:0; left:0;
    }
    .temp-real {
      font-family:'DSEG7','Courier New',monospace;
      font-size:11vw; letter-spacing:0.025em; position:relative;
    }
    .temp-real sup { font-size:2.7vw; vertical-align:super; opacity:0.75; font-family:'Share Tech Mono','Courier New',monospace; }
    .w-desc { margin-top:0.8vh; font-size:1.35vw; letter-spacing:0.08em; text-transform:uppercase; }
    .w-meta { margin-left:1.3vw; margin-top:0; font-size:1.35vw; line-height:2.0; letter-spacing:0.025em; white-space:nowrap; }

    /* PREVISÃO DE 7 DIAS */
    .forecast-row {
      display:-webkit-flex; display:flex;
      -webkit-flex-direction:row; flex-direction:row;
      -webkit-justify-content:space-between; justify-content:space-between;
      -webkit-align-items:stretch; align-items:stretch;
      width:100%; height:100%; min-height:0;
    }
    .forecast-day {
      display:-webkit-flex; display:flex;
      -webkit-flex-direction:column; flex-direction:column;
      -webkit-align-items:center; align-items:center;
      -webkit-justify-content:space-around; justify-content:space-around;
      width:14%; text-align:center; min-width:0;
      border-right:1px solid rgba(120,150,80,0.18);
    }
    .forecast-day:last-child { border-right:0; }
    .forecast-name { font-size:1.15vw; letter-spacing:0.05em; }
    .forecast-icon { font-size:2.6vw; line-height:1.2; }
    .forecast-high { font-size:1.55vw; font-weight:bold; }
    .forecast-low { font-size:1.35vw; }
    .forecast-caption { font-size:0.85vw; letter-spacing:0.08em; margin-top:0.4vh; }

  </style>
</head>
<body>
<div class="watch" id="watch">
  <div class="watch-inner" id="watch-inner"></div>

  <div class="header" id="header">
    <span class="h-label" id="h-left">&#9679; CASIO &nbsp;&#183;&nbsp; WORLD TIME</span>
    <span class="h-label" id="seconds">--</span>
    <div class="modes">
      <button class="mode-btn" id="btn-green" onclick="setTheme('green')">GRN</button>
      <button class="mode-btn" id="btn-blue"  onclick="setTheme('blue')">BLU</button>
      <button class="mode-btn" id="btn-mono"  onclick="setTheme('mono')">B&amp;W</button>
    </div>
  </div>

  <div class="time-block" id="time-block">
    <div class="lcd-wrap">
      <div class="lcd-ghost" id="clock-ghost">88<span>:</span>88</div>
      <div class="lcd-real"  id="clock-real">00<span class="sep-blink">:</span>00</div>
    </div>
    <div class="date-row">
      <div class="date-chip" id="date-day">DOM</div>
      <div class="date-chip" id="date-full">--</div>
    </div>
  </div>

  <div class="bottom">
    <div class="panel panel-left" id="panel-left">
      <div class="panel-label" id="panel-label-left">&#9650; TEMPO / PIRACICABA</div>
      <div id="weather-section"><div class="msg" id="w-msg">CARREGANDO_</div></div>
    </div>
    <div class="panel panel-right" id="panel-right">
      <div class="panel-label" id="panel-label-right">&#9632; PRÓXIMOS 7 DIAS</div>
      <div id="forecast-section"><div class="msg">CARREGANDO_</div></div>
    </div>
  </div>
</div>

<script>
  var LAT=-22.7253, LON=-47.6492;
  var DIAS =['DOM','SEG','TER','QUA','QUI','SEX','SÁB'];
  var MESES=['JAN','FEV','MAR','ABR','MAI','JUN','JUL','AGO','SET','OUT','NOV','DEZ'];
  var WMO={0:'CÉU LIMPO',1:'QUASE LIMPO',2:'PARC. NUBLADO',3:'NUBLADO',
    45:'NEBLINA',48:'NEBLINA GELADA',51:'GAROA',53:'GAROA+',55:'GAROA++',
    61:'CHUVA',63:'CHUVA+',65:'CHUVA++',71:'NEVE',73:'NEVE+',75:'NEVE++',
    80:'PANCADAS',81:'PANCADAS+',82:'PANCADAS++',85:'NEVE',
    95:'TROVOADAS',96:'GRANIZO',99:'GRANIZO+'};

  // ── TEMAS (colores directos, sin CSS variables) ────────────
  var THEMES = {
    green: {
      bodyBg:    '#0A0A08',
      screenBg:  '#141F0C',
      segOn:     '#B8D870',
      segOff:    '#1E2E10',
      segDim:    '#4A6228',
      border:    '#3A5220',
      label:     '#527030',
      glow:      'rgba(168,210,80,0.35)',
      scanline:  'rgba(0,0,0,0.22)'
    },
    blue: {
      bodyBg:    '#05080F',
      screenBg:  '#0A1020',
      segOn:     '#70B8FF',
      segOff:    '#0E1E32',
      segDim:    '#204060',
      border:    '#1A4070',
      label:     '#2A5080',
      glow:      'rgba(80,160,255,0.35)',
      scanline:  'rgba(0,0,0,0.22)'
    },
    mono: {
      bodyBg:    '#050505',
      screenBg:  '#0F0F0F',
      segOn:     '#DEDEDE',
      segOff:    '#1C1C1C',
      segDim:    '#4A4A4A',
      border:    '#333333',
      label:     '#444444',
      glow:      'rgba(210,210,210,0.2)',
      scanline:  'rgba(0,0,0,0.28)'
    }
  };

  function applyTheme(t) {
    var c = THEMES[t];
    // Body
    document.body.style.backgroundColor = c.bodyBg;
    // Watch
    var w = document.getElementById('watch');
    w.style.backgroundColor = c.screenBg;
    w.style.borderColor = c.border;
    w.style.backgroundImage = 'repeating-linear-gradient(0deg,'+c.scanline+' 0px,'+c.scanline+' 1px,transparent 1px,transparent 3px)';
    // Inner border
    document.getElementById('watch-inner').style.borderColor = c.segOff;
    // Header
    var header = document.getElementById('header');
    header.style.borderBottomColor = c.segOff;
    colorEls('h-label', c.label);
    // Mode buttons
    var btnIds = ['green','blue','mono'];
    for (var i=0;i<btnIds.length;i++) {
      var btn = document.getElementById('btn-'+btnIds[i]);
      if (btn) {
        btn.style.color = btnIds[i]===t ? c.segOn : c.segDim;
        btn.style.borderColor = btnIds[i]===t ? c.segDim : c.segOff;
      }
    }
    // Time block
    document.getElementById('time-block').style.borderBottomColor = c.segOff;
    // Clock ghost/real
    document.getElementById('clock-ghost').style.color = c.segOff;
    var cr = document.getElementById('clock-real');
    cr.style.color = c.segOn;
    cr.style.textShadow = '0 0 16px '+c.glow+', 0 0 40px '+c.glow;
    // Date chips
    colorEls('date-chip', c.segDim);
    var df = document.getElementById('date-full');
    if (df) df.style.color = c.segOn;
    // Panels
    document.getElementById('panel-left').style.borderRightColor = c.segOff;
    colorEls('panel-label', c.label);
    document.getElementById('panel-label-left').style.borderBottomColor = c.segOff;
    var pr=document.getElementById('panel-right');
    if (pr) pr.style.borderLeftColor=c.segOff;
    var plr=document.getElementById('panel-label-right');
    if (plr) plr.style.borderBottomColor=c.segOff;
    // Weather
    applyWeatherColors(c);
    // Store
    window._theme = t;
    window._colors = c;
    localStorage.setItem('casio-theme', t);
  }

  function colorEls(cls, color) {
    var els = document.getElementsByClassName(cls);
    for (var i=0;i<els.length;i++) els[i].style.color = color;
  }

  function applyWeatherColors(c) {
    var tg = document.querySelector('.temp-ghost');
    var tr = document.querySelector('.temp-real');
    var wd = document.querySelector('.w-desc');
    var wm = document.querySelector('.w-meta');
    if (tg) tg.style.color = c.segOff;
    if (tr) { tr.style.color = c.segOn; tr.style.textShadow = '0 0 12px '+c.glow; }
    if (wd) wd.style.color = c.segDim;
    if (wm) { wm.style.color = c.label; colorBolds(wm, c.segOn); }
    var msg = document.getElementById('w-msg');
    if (msg) msg.style.color = c.segDim;
    var forecast=document.getElementById('forecast-section');
    if (forecast) {
      var fitems=forecast.getElementsByTagName('*');
      for (var fi=0;fi<fitems.length;fi++) {
        var cls=fitems[fi].className||'';
        if (cls==='forecast-name' || cls==='forecast-low') fitems[fi].style.color=c.label;
        if (cls==='forecast-icon' || cls==='forecast-high') fitems[fi].style.color=c.segOn;
      }
    }
  }

  function colorBolds(el, color) {
    var bs = el.getElementsByTagName('b');
    for (var i=0;i<bs.length;i++) bs[i].style.color = color;
  }

  function setTheme(t) { applyTheme(t); }

  // ── RELOJ ─────────────────────────────────────────────────
  function pad(n){ return n<10?'0'+n:''+n; }

  function updateClock() {
    var now=new Date();
    document.getElementById('clock-real').innerHTML =
      pad(now.getHours())+'<span class="sep-blink">:</span>'+pad(now.getMinutes());
    document.getElementById('clock-ghost').innerHTML = '88<span>:</span>88';
    document.getElementById('seconds').textContent = pad(now.getSeconds());
    document.getElementById('date-day').textContent = DIAS[now.getDay()];
    document.getElementById('date-full').textContent =
      pad(now.getDate())+'-'+MESES[now.getMonth()]+'-'+now.getFullYear();
    // Re-aplicar color de fecha
    if (window._colors) {
      document.getElementById('date-day').style.color  = window._colors.segDim;
      document.getElementById('date-full').style.color = window._colors.segOn;
      document.getElementById('clock-ghost').style.color = window._colors.segOff;
      var cr = document.getElementById('clock-real');
      cr.style.color = window._colors.segOn;
      cr.style.textShadow = '0 0 16px '+window._colors.glow+', 0 0 40px '+window._colors.glow;
      document.getElementById('seconds').style.color = window._colors.label;
    }
  }

  // ── PREVISÃO ───────────────────────────────────────────────
  var WMO_ICON={0:'☀',1:'☀',2:'⛅',3:'☁',45:'≋',48:'≋',51:'☂',53:'☂',55:'☂',
    61:'☂',63:'☂',65:'☂',71:'❄',73:'❄',75:'❄',80:'☂',81:'☂',82:'☂',
    85:'❄',95:'⚡',96:'⚡',99:'⚡'};

  function dayLabel(iso, index) {
    if (index === 0) return 'HOJE';
    var parts=iso.split('-');
    var date=new Date(Number(parts[0]),Number(parts[1])-1,Number(parts[2]));
    return DIAS[date.getDay()];
  }

  function renderForecast(d, c) {
    var target=document.getElementById('forecast-section');
    if (!d.daily || !d.daily.time || !d.daily.temperature_2m_max) {
      target.innerHTML='<div class="msg" style="color:'+c.segDim+'">SEM PREVISÃO_</div>';
      return;
    }
    var daily=d.daily, out='<div class="forecast-row">';
    for (var i=0;i<daily.time.length && i<7;i++) {
      var code=daily.weather_code[i];
      var icon=WMO_ICON[code]||'·';
      var hi=Math.round(daily.temperature_2m_max[i]);
      var lo=Math.round(daily.temperature_2m_min[i]);
      out+='<div class="forecast-day">'+
        '<div class="forecast-name" style="color:'+c.label+'">'+dayLabel(daily.time[i],i)+'</div>'+
        '<div class="forecast-icon" style="color:'+c.segOn+'">'+icon+'</div>'+
        '<div class="forecast-high" style="color:'+c.segOn+'">'+hi+'°</div>'+
        '<div class="forecast-low" style="color:'+c.segDim+'">'+lo+'°</div>'+
      '</div>';
    }
    out+='</div>';
    target.innerHTML=out;
  }

  // ── CLIMA ─────────────────────────────────────────────────
  function fetchWeather() {
    var xhr=new XMLHttpRequest();
    xhr.open('GET','/api/weather?lat='+LAT+'&lon='+LON,true);
    xhr.onreadystatechange=function(){
      if(xhr.readyState!==4) return;
      var el=document.getElementById('weather-section');
      var c=window._colors||THEMES.green;
      if(xhr.status===200){
        try{
          var d=JSON.parse(xhr.responseText),cw=d.current_weather;
          var h=new Date().getHours();
          var temp=Math.round(cw.temperature);
          var sens=Math.round(d.hourly.apparent_temperature[h]!==undefined?d.hourly.apparent_temperature[h]:temp);
          var hum=d.hourly.relativehumidity_2m[h]!==undefined?d.hourly.relativehumidity_2m[h]:'--';
          var wind=Math.round(cw.windspeed);
          el.innerHTML=
            '<div class="weather-row">'+
              '<div class="weather-main">'+
                '<div class="temp-wrap">'+
                  '<div class="temp-ghost" style="color:'+c.segOff+'">88!</div>'+
                  '<div class="temp-real" style="color:'+c.segOn+';text-shadow:0 0 12px '+c.glow+'">'+temp+'<sup>°C</sup></div>'+
                '</div>'+
                '<div class="w-desc" style="color:'+c.segDim+'">'+(WMO[cw.weathercode]||'--')+'</div>'+
              '</div>'+
              '<div class="w-meta" style="color:'+c.label+'">SENSAÇÃO <b style="color:'+c.segOn+'">'+sens+'°</b><br>UMIDADE <b style="color:'+c.segOn+'">'+hum+'%</b><br>VENTO <b style="color:'+c.segOn+'">'+wind+' KM/H</b></div>'+
            '</div>';
          renderForecast(d,c);
        }catch(e){el.innerHTML='<div class="msg" style="color:'+c.segDim+'">NO DATA_</div>';}
      }else{
        el.innerHTML='<div class="msg" style="color:'+c.segDim+'">NO DATA_</div>';
        document.getElementById('forecast-section').innerHTML='<div class="msg" style="color:'+c.segDim+'">SEM PREVISÃO_</div>';
      }
    };
    xhr.send();
  }

  function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

  // ── INIT ──────────────────────────────────────────────────
  var savedTheme = localStorage.getItem('casio-theme')||'green';
  applyTheme(savedTheme);

  updateClock();
  setInterval(updateClock,1000);
  fetchWeather();
  setInterval(fetchWeather,10*60*1000);
  document.addEventListener('touchstart',function(){},false);
</script>
</body>
</html>
